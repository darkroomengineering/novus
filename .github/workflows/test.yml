name: Test
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The whole run takes under a minute, so one job runs every step as a
  # parallel process instead of paying for install in each of four jobs. The
  # reusable workflow sets its own concurrency, so none is set here.
  bun:
    uses: darkroomengineering/.github/.github/workflows/bun-ci.yml@main
    with:
      runs-on: '"ubuntu-latest"'
      single-job: true
      setup: bun react-router typegen
      lint: bun run lint && bun oxfmt --check .
      typecheck: bun check --no-script
      build: bun run build
      # The starter has no tests yet.
      test: ''
      # Waiting for a newer push saves nothing on a run this short.
      main-delay: 0
